name: Duels
version: '${version}'
main: mine.deniilo.duels.DuelsPlugin
api-version: '26.3'
description: Дуэли 1v1 с боевым балансом CivCraft
authors: [deniilo]

commands:
  duel:
    description: Команды дуэлей
    usage: /<command> [join|exit|queue|stats|top|leave|admin]
    aliases: [duels]

permissions:
  duels.admin:
    description: Администрирование дуэлей (спавны, телепорты)
    default: op
