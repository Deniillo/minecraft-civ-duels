# Сообщения плагина. Формат MiniMessage: https://docs.advntr.dev/minimessage/format.html
# Плейсхолдеры вида {name} подставляются плагином.
prefix: "<gray>[<gold>Дуэли</gold>]</gray> "
players-only: "<red>Эта команда только для игроков.</red>"
no-permission: "<red>Недостаточно прав.</red>"
unknown-subcommand: "<red>Неизвестная подкоманда.</red> <gray>Доступно: /duel, /duel queue, /duel stats, /duel top, /duel leave, /duel hub</gray>"
to-lobby: "<green>Вы в лобби дуэлей.</green>"
to-hub: "<green>Вы вернулись в хаб.</green>"
world-missing: "<red>Мир недоступен: {world}. Сообщите администратору.</red>"
admin-usage: "<yellow>Использование:</yellow> /duel admin setspawn|tp [ключ] или give [набор]|clear|info. Ключи: {keys}"
spawn-unknown: "<red>Неизвестная точка:</red> {key}. <gray>Доступно: {keys}</gray>"
spawn-set: "<green>Точка {key} сохранена:</green> <gray>{where}</gray>"
spawn-no-ground: "<red>Под этой точкой нет пола (пустота): матч с ней не начнётся. Встаньте на землю и задайте точку снова.</red>"
spawn-teleported: "<green>Телепорт к точке {key}.</green>"
kit-given: "<green>Выдан набор:</green> {kit}"
kit-unknown: "<red>Неизвестный набор:</red> {kit}. <gray>Доступно: {kits}</gray>"
kit-broken: "<red>Набор {kit} собрать не удалось, смотрите лог сервера.</red>"
kit-cleared: "<green>Инвентарь и эффекты набора сняты.</green>"
kit-info: "<yellow>Броня:</yellow> защита {defense}, макс. HP {hp}, скорость {speed}%. <gray>LIGHT {light}, HEAVY {heavy}, SOUL {soul}; полный SOUL: {soulset}, полный SOUL T5: {soult5}</gray>"
weapon-forbidden: "<red>{reason}</red>"
combat-usage: "<yellow>Использование:</yellow> /duel admin dummy [набор]|clear, debug on|off, hitme [оружие] [melee|throw|bow|crossbow] [E] [P] [crit]"
dummy-spawned: "<green>Мишень создана:</green> {kit}. <gray>Бейте её своим набором, включите /duel admin debug on для разбора.</gray>"
dummy-cleared: "<green>Мишеней убрано:</green> {count}. <gray>Боевой режим выключен.</gray>"
dummy-peaceful: "<red>В хабе и лобби мишень не создать (мирный режим).</red> <gray>Перейдите на арену: /duel admin tp arena-a</gray>"
debug-on: "<green>Разбор ударов включён.</green>"
debug-off: "<green>Разбор ударов выключен.</green>"
hitme-usage: "<yellow>Использование:</yellow> /duel admin hitme [оружие] [melee|throw|bow|crossbow] [E] [P] [crit]"
hitme-unknown-weapon: "<red>Неизвестное оружие:</red> {weapon}"
hitme-mismatch: "<red>Этот способ не подходит этому оружию.</red>"
hitme-result: "<yellow>Имитация удара:</yellow> <gray>{report}</gray>"
hitme-lethal: "<red>Удар смертелен, здоровье восстановлено.</red> <gray>{report}</gray>"
match-win: "<green><bold>Победа!</bold></green> Соперник: {opponent}. Причина: {reason}. Бой: {seconds} с.{training}"
match-loss: "<red><bold>Поражение.</bold></red> Победил {opponent}. Причина: {reason}. Бой: {seconds} с.{training}"
match-draw: "<yellow><bold>Ничья.</bold></yellow> Причина: {reason}. Бой: {seconds} с.{training}"
training-left: "<gray>Тренировка завершена ({seconds} с).</gray>"
training-opponent-left: "<gray>Соперник покинул тренировку ({seconds} с).</gray>"
match-cancelled: "<gray>Матч отменён: {reason}. Рейтинг не изменён.</gray>"
match-restored: "<green>Ваши вещи и состояние возвращены.</green>"
match-started: "<green>Матч запущен.</green>"
match-usage: "<yellow>Использование:</yellow> /duel admin match solo [набор] | match [игрок1] [игрок2] [набор] [ranked] | match cancel"
match-offline: "<red>Оба игрока должны быть в сети.</red>"
match-admin-cancelled: "<green>Матчей отменено:</green> {count}"
match-error-busy: "<red>Игрок уже участвует в матче.</red>"
