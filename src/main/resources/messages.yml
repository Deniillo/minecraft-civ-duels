match-error-arena: "<red>Свободной арены нет.</red>"
match-error-spawns: "<red>Не заданы точки арены.</red> <gray>/duel admin setspawn arena-a и arena-b</gray>"
match-error-same: "<red>Нужны два разных игрока.</red>"
match-error-store: "<red>Не удалось сохранить состояние игрока, матч не запущен. Подробности в логе сервера.</red>"
not-in-match: "<red>Вы не в матче.</red>"
match-command-blocked: "<red>Во время матча доступны только команды /duel.</red>"

# ---- очередь, рейтинг, статистика ----
queue-usage: "<yellow>Использование:</yellow> /duel queue [набор] (рейтинговый поиск). <gray>Наборы: {kits}</gray>"
queue-joined: "<green>Вы в рейтинговом поиске:</green> {kit}. <gray>Выйти: /duel leave</gray>"
queue-left: "<green>Вы вышли из очереди.</green>"
queue-in-match: "<red>Вы уже в матче.</red>"
