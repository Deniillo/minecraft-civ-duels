# Основные настройки плагина дуэлей.
# Точки спавна хранятся отдельно, в spawns.yml (их пишет сам плагин командой /duel admin setspawn).

# Телепортировать игрока в хаб при каждом входе на сервер
join-teleport-to-hub: true

worlds:
  # Хаб: сюда игрок попадает при входе
  hub:
    name: duels_hub
    # true: если мира нет, плагин сам создаст пустой мир с платформой
    generate-if-missing: true
    platform-material: SMOOTH_QUARTZ
  # Лобби дуэлей: отсюда игрок встаёт в очередь
  lobby:
    name: duels_lobby
    generate-if-missing: true
    platform-material: STONE_BRICKS
  # Арена: готовая карта, папка мира лежит рядом с сервером (см. README)
  arena:
    name: duels_arena
    # true: если папки с картой нет, создаётся пустая платформа, чтобы можно было тестировать
    generate-if-missing: true
    platform-material: DEEPSLATE_TILES

debug:
  # true: писать разбор каждого удара в plugins/Duels/combat-debug.log (на бой не влияет)
  combat-file-log: false

match:
  # секунд отсчёта до начала боя (урон в это время запрещён)
  countdown-seconds: 3
  # максимальная длительность боя, по истечении ничья без рейтинга
  max-duration-seconds: 600
  # пауза после итога перед возвратом игроков в лобби, в тиках (20 тиков = 1 секунда)
  result-delay-ticks: 60

# NPC-распорядитель в хабе и лобби (правый клик открывает меню)
npc:
  # true: при запуске создать NPC в хабе и лобби, если его там ещё нет
  auto-create: true

# Подбор соперника. Рейтинговая очередь ищет близкий рейтинг, окно расширяется с ожиданием.
# Тренировочная очередь подбирает по порядку входа.
queue:
  base-window: 100
  widen-per-step: 50
  step-seconds: 5
  max-window: 1000

# Рейтинг Elo (раздел 11 ТЗ). Рейтинг раздельный по наборам.
elo:
  start-rating: 1000
  k-factor: 32
  floor: 0
  # false: победитель получает полный прирост, даже если проигравший упёрся в нижнюю границу
  conserve-sum: false

# Арены матчей. Для каждого матча создаётся отдельная копия мира арены и удаляется после матча,
# поэтому одновременно идёт несколько матчей. Точки arena-a и arena-b задаются в исходном мире арены.
arenas:
  # сколько матчей одновременно (каждая копия занимает память и место на диске)
  max-concurrent: 4
  # размер границы мира вокруг арены в блоках, 0: не использовать (у встроенной платформы есть барьерные стены)
  border-size: 0
  # большая карта копируется на матч не целиком, а только регионы в этом радиусе (блоки) вокруг точек arena-a/arena-b;
  # 0: копировать весь мир
  copy-radius: 192

# Тренировочные комнаты (матчи без рейтинга): сколько кнопок-комнат в меню (1-36)
training:
  rooms: 12

# Таблица лидеров текстом в хабе и лобби (общий рейтинг)
leaderboard:
  auto-create: true
  size: 10
  update-seconds: 30
