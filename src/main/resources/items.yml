# Профили предметов (ТЗ, разделы 4-5). Числа указаны в HP: 2 HP = одно сердечко.
# Скорость брони: прибавка к базе движения, 0.01 = +1%.
# ID брони строится как <класс>_t<тир>_<слот>, например heavy_t4_helmet.
# ВАЖНО: тест ItemCatalogTest сверяет этот файл с таблицами ТЗ.

armor:
  light:
    t1: {material: LEATHER, defense: 2.0, hp: 0.0, speed: 0.01}
    t2: {material: LEATHER, defense: 3.0, hp: 0.5, speed: 0.02}
    t3: {material: LEATHER, defense: 4.0, hp: 1.0, speed: 0.035}
    t4: {material: LEATHER, defense: 5.0, hp: 1.5, speed: 0.045}
    t5: {material: LEATHER, defense: 7.5, hp: 0.0, speed: 0.075}
  heavy:
    t1: {material: IRON, defense: 2.75, hp: 1.0, speed: -0.01}
    t2: {material: CHAINMAIL, defense: 3.75, hp: 2.0, speed: -0.02}
    t3: {material: GOLDEN, defense: 4.75, hp: 2.5, speed: -0.025}
    t4: {material: DIAMOND, defense: 5.75, hp: 3.0, speed: -0.035}
  soul:
    t1: {material: IRON, defense: 2.75, hp: 1.5, speed: 0.01}
    t2: {material: CHAINMAIL, defense: 3.75, hp: 2.5, speed: 0.02}
    t3: {material: GOLDEN, defense: 4.75, hp: 3.0, speed: 0.035}
    t4: {material: DIAMOND, defense: 5.75, hp: 4.0, speed: 0.045}
    t5: {material: NETHERITE, defense: 5.75, hp: 4.5, speed: 0.035, boots-speed: 0.045}

weapons:
  # Мечи
  sword_t1_wood:      {kind: SWORD, tier: 1, material: WOODEN_SWORD, attack: 7}
  sword_t1_stone:     {kind: SWORD, tier: 1, material: STONE_SWORD, attack: 12}
  sword_t1_iron:      {kind: SWORD, tier: 1, material: IRON_SWORD, attack: 14}
  sword_t2_steel:     {kind: SWORD, tier: 2, material: IRON_SWORD, attack: 18}
  sword_t3_carbide:   {kind: SWORD, tier: 3, material: GOLDEN_SWORD, attack: 22}
  sword_t4_tungsten:  {kind: SWORD, tier: 4, material: DIAMOND_SWORD, attack: 27}
  sword_t5_soul:      {kind: SWORD, tier: 5, material: NETHERITE_SWORD, attack: 35}
  # Боевые секиры
