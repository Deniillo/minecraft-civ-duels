  axe_t1_iron:        {kind: AXE, tier: 1, material: IRON_AXE, attack: 17}
  axe_t2_steel:       {kind: AXE, tier: 2, material: IRON_AXE, attack: 21}
  axe_t3_carbide:     {kind: AXE, tier: 3, material: GOLDEN_AXE, attack: 25}
  axe_t4_tungsten:    {kind: AXE, tier: 4, material: DIAMOND_AXE, attack: 30}
