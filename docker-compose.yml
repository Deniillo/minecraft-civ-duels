# Тестовый сервер Paper 26.3 для разработки плагина.
# Запуск: см. README.md. Данные сервера лежат в docker/data (не коммитятся).
services:
  paper:
    image: itzg/minecraft-server:java25
    container_name: duels-paper
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      MEMORY: "2G"
      TZ: "Europe/Belgrade"
      # Для локальной разработки: вход без лицензионной проверки.
      # На боевом сервере за прокси выставляется по схеме сети (ТЗ раздел 2).
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "8"
      PVP: "TRUE"
      ALLOW_NETHER: "FALSE"
      GENERATE_STRUCTURES: "FALSE"
      MOTD: "Duels dev server"
      ENABLE_ROLLING_LOGS: "true" # только в нижнем регистре, иначе образ выдаёт ошибку в bash
    volumes:
      - ./docker/data:/data
    stdin_open: true
    tty: true
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Туннель playit.gg: друзья заходят по адресу из панели playit, без проброса портов.
  # Ключ лежит в .env (не коммитится). Агент живёт в сетевом пространстве контейнера paper:
  # для него 127.0.0.1:25565 и есть сервер. Имя "paper" в поле локального адреса панели агент
  # не понимает (подставляет 0.0.0.0) — туннель тогда сбрасывает соединения.
  # На маке network_mode: host не достаёт до сервера, а service:paper работает.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: duels-playit
    network_mode: "service:paper"
    depends_on:
      - paper
    environment:
      SECRET_KEY: "${PLAYIT_SECRET}"
    restart: "unless-stopped"
